repos:
repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint life_expectancy.cleaning
        language: system
        files: ^life_expectancy/.*\.py$
        pass_filenames: false
  